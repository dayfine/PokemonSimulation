name: Verify PokemonSimulation map packs
description: Check vendored Arduino JSON against its pinned publishing commits.
runs:
  using: composite
  steps:
    - name: Fetch approved map publishing history
      uses: actions/checkout@v4
      with:
        repository: dayfine/PokemonSimulation
        ref: main
        fetch-depth: 0
        path: .pokesim-map-source
        persist-credentials: false
    - name: Check locked map exports
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../src
      run: >-
        python3 -m pokesim.maps.consumer_sync check
        --consumer "$GITHUB_WORKSPACE"
        --source "$GITHUB_WORKSPACE/.pokesim-map-source"
        --offline

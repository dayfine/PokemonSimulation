# Runs the Python unit tests on the oldest and newest supported Pythons.
# 3.8 is what the lab Mac has; ubuntu-22.04 still ships a 3.8 build for
# setup-python.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  map-consumer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize a consumer fixture from approved published maps
        env:
          PYTHONPATH: src
        run: >-
          python3 -m pokesim.maps.consumer_sync update
          --consumer "$GITHUB_WORKSPACE" --source "$GITHUB_WORKSPACE" --offline
          --game bdsp --game frlg --revision "$(git rev-parse origin/main)"
      - name: Exercise the Arduino integration action
        uses: ./integrations/arduino-source/verify-map-packs
      - name: Ensure a local map edit fails the consumer check
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          from pokesim.maps.consumer_sync import DESTINATIONS
          target = next(Path(DESTINATIONS['bdsp']).glob('*.json'))
          target.write_bytes(target.read_bytes() + b'\n')
          result = subprocess.run([sys.executable, '-m', 'pokesim.maps.consumer_sync',
              'check', '--consumer', '.', '--source', '.pokesim-map-source', '--offline'],
              capture_output=True, text=True)
          assert result.returncode == 1 and 'modified ' + target.name in result.stderr, result
          print('Consumer correctly rejected local drift: ' + target.name)
          PY

  item-sources:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce item identities from pinned public sources
        env:
          PYTHONPATH: src
        run: >-
          python3 -m pokesim.maps.item_identity
          --cache "$RUNNER_TEMP/pokesim-item-sources" --fetch --check

  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: PYTHONPATH=src python -m unittest discover -v -s src -t src
      - name: Audit published map inventory and hashes
        run: PYTHONPATH=src python -m pokesim.maps.runtime_map_pack
      - name: Upload actual golden routes on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-goldens-python-${{ matrix.python-version }}
          path: build/route-goldens/
          if-no-files-found: ignore

  battle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engines/frlg-showdown/package-lock.json
      - name: Install the pinned battle engine
        run: npm ci --omit=optional --prefix engines/frlg-showdown
      - name: Check FRLG mechanics boundaries
        run: npm test --prefix engines/frlg-showdown
      - name: Check Python policies and reproducible benchmarks
        run: POKESIM_REQUIRE_BATTLE=1 PYTHONPATH=src python -m unittest discover -v -s src -t src
